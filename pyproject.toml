[build-system]
requires = ["setuptools>=64", "wheel", "poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "guts-discordbot"
version = "3.5.0"
description = "A highly customisable Discord bot"
authors = [{ name = "PrivelGOAT" }]
readme = "README.md"
packages = [{ include = "redbot" }]
homepage = "https://github.com/PrivelGOAT/GUTS-DiscordBot"
license = "GPL-3.0-or-later"
keywords = ["discord", "bot", "redbot"]

[tool.poetry.dependencies]
python = ">=3.8,<3.12"  # 🔄 Rend compatible avec les versions stables (évite 3.13)
red-commons = "^1.0.0"  # ✅ Ajoute la dépendance manquante
Red-DiscordBot = { git = "https://github.com/Cog-Creators/Red-DiscordBot.git", rev = "V3/develop" }  # ✅ Framework principal

[tool.poetry.scripts]
redbot = "redbot.__main__:main"
redbot-setup = "redbot.setup:run_cli"

[tool.black]
line-length = 99
required-version = "23"
target-version = ["py38"]
include = "\\.py$"
force-exclude = '''
/(
    redbot\/vendored
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"

